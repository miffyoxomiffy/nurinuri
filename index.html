function withoutFinalPeriod(s){return s.endsWith('.')?s.slice(0,-1):s;}

 const actual=Array.from(withoutFinalPeriod(value));
 const n=expected.length,m=actual.length;

 for(let j=0;j<=m;j++)dp[0][j]=j;
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(expected[i-1]===actual[j-1]?0:1));
 const bad=new Set();let i=n,j=m;
 while(i||j){
  if(i&&j&&expected[i-1]===actual[j-1]&&dp[i][j]===dp[i-1][j-1]){i--;j--;}
  else if(i&&j&&dp[i][j]===dp[i-1][j-1]+1){bad.add(i-1);i--;j--;}
  else if(i&&dp[i][j]===dp[i-1][j]+1){bad.add(i-1);i--;}
  else{bad.add(Math.min(i,n-1));j--;}
 }
 if(answer.endsWith('.'))expected.push('.');
 return expected.map((text,k)=>({text,wrong:bad.has(k)}));
}

}

  if(r.heading){const h=document.createElement(/^\d+\./.test(r.heading)?'h4':'h3');h.className='heading'+(/^\d+\./.test(r.heading)?' minor':'');if(active===1&&!/^\d+\./.test(r.heading))h.className+=' chapter-banner';h.textContent=r.heading;$('paper').append(h);return;}
  const key=keyFor(active,i);const old=state[key]||{};
  const row=document.createElement('div');row.className='row'+(r.prefix?'':' unnumbered')+(/^\d+\)$/.test(r.prefix)?' subtopic':'');
  const entry=document.createElement('div');entry.className='entry';
  const prefix=document.createElement('span');prefix.className='prefix';prefix.textContent=r.prefix;
  const input=document.createElement('textarea');input.rows=1;input.placeholder='';input.value=typeof old.value==='string'?old.value:'';input.autocomplete='off';input.spellcheck=false;input.setAttribute('autocorrect','off');input.setAttribute('autocapitalize','off');input.setAttribute('aria-label',DATA[active].title+' '+(r.prefix||'문장')+' 내용 입력 '+(i+1));input.enterKeyHint='next';
  const feedback=document.createElement('div');feedback.className='feedback';feedback.id='answer-'+active+'-'+i;feedback.setAttribute('aria-live','polite');input.setAttribute('aria-describedby',feedback.id);
  function show(){const s=state[key];feedback.replaceChildren();if(s?.checked)displayCorrection(feedback,input.value,r.answer);}
  function grade(){state[key]={value:input.value,checked:true};show();save();}
  input.addEventListener('input',()=>{const checked=!!state[key]?.checked;state[key]={value:input.value,checked};fit(input);if(checked&&!input.matches(':focus'))show();else feedback.replaceChildren();save();});
  input.addEventListener('blur',()=>{if(input.value!==''||state[key]?.checked)grade();});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();grade();const inputs=[...$('paper').querySelectorAll('textarea')];const next=inputs[inputs.indexOf(input)+1];if(next)next.focus();else input.blur();}});
  input._grade=grade;show();entry.append(prefix,input);row.append(entry,feedback);$('paper').append(row);
 });
 $('paper').querySelectorAll('textarea').forEach(fit);save();
}
$('gradeAll').onclick=()=>{$('paper').querySelectorAll('textarea').forEach(el=>el._grade());};
$('clear').onclick=()=>$('resetDialog').showModal();
$('cancelReset').onclick=()=>$('resetDialog').close();
$('confirmReset').onclick=()=>{Object.keys(state).forEach(k=>{if(k.startsWith(active+':'))delete state[k];});$('resetDialog').close();save();render();};

window.addEventListener('resize',()=>$('paper').querySelectorAll('textarea').forEach(fit));render();
</script></body></html>
